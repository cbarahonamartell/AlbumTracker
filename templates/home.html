<!DOCTYPE html>
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body class="bg-dark text-white">
        <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
            <div class="container-fluid justify-content-start">
                <a class="navbar-brand btn btn-outline-white btn-lg ms-3" href="/"role="button">Album Tracker</a>
                <a href="/add" class="btn btn-outline-white btn-lg" role="button">Add</a>
            </div>

        </nav>
            <div class="container text-center p-4">
                <div class="row gy-5">
                    {% for album in albums %}
                    <div class="col">
                    <div class="card text-bg-dark" style="width: 18rem;">
                        <img src="{{ album.image }}" class="card-img-top" alt="{{ album.name }}">
                        <div class="card-body">
                            <h5 class="card-title">{{ album.name }}</h5>
                        <p class="card-text">by {{ album.artist }}</p>
                        <p class="card-text">{{ album.review }}</p>
                        <p class="card-text">Rating: {{ album.rating }}</p>
                        <p class="card-text">{{ album.date_logged }}</p>
                        <form method="POST" action="/delete">
                            <input type="hidden" name="album_id" value="{{ album.id }}">
                            <button type="submit" class="btn btn-danger">Delete</button>
                        </form>
                    </div>
                </div>
                </div>
            {% endfor %}
        </div>
    </div>
    </body>
</html>
