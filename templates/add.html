<!DOCTYPE html>
<html>
    <body>
        <form method="POST">
            <input type="text" name="search_query">
            <button type="submit">Add Album</button>
        </form>
        {% if results %}
        <ul>
            {% for album in results %}
            <form method="POST">
                <li>{{ album.name }} by {{ album.artist }}</li>
                <input type="hidden" name="album_name" value="{{ album.name }}">
                <input type="hidden" name="artist_name" value="{{ album.artist }}">
                <button type ="submit">Add this album</button>
            </form>
        {% endfor %}
        </ul>
        {% endif %}
    </body>
</html>
