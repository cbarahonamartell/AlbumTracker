<!DOCTYPE html>
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-dark text-white">
        <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
            <div class="container-fluid justify-content-start">
                <a class="navbar-brand btn btn-outline-white btn-lg ms-3" href="/" role="button">Album Tracker</a>
                <a href="/add" class="btn btn-outline-white btn-lg" role="button">Add</a>
            </div>
        </nav>
        <form method="POST">
            <input type="text" name="search_query" class="form-control-lg bg-dark border-white text-white ms-5 mt-4">
            <button type="submit" class='btn btn-primary'>Search Album</button>
        </form>
        {% if results %}
        <div class="container text-center">
                <div class="row gy-5">
            {% for album in results %}
            <div class="col">
                <div class="card text-bg-dark" style="width: 18rem;">
                    <form method="POST">
                        <h5 class="card-title">{{ album.name }}</h5>
                        <p class="card-text">by {{ album.artist }}</p>
                        <input type="hidden" name="album_name" value="{{ album.name }}">
                        <input type="hidden" name="artist_name" value="{{ album.artist }}">
                            <input type='hidden' name='album_image' value='{{ album.image_url }}'>
                            <img src="{{ album.image_url }}" class="card-img-top" alt="{{ album.name }}">
                            <textarea name="review"class="form-control-lg bg-dark border-white text-white my-2"></textarea>
                            <select name = "rating" class="forom-select bg-dark text-white border-white">
                                <option value ='1'>1</option>
                                <option value ='1.5'>1.4</option>
                                <option value ='2'>2</option>
                                <option value ='2.5'>2.5</option>
                                <option value ='3'>3</option>
                                <option value ='3.5'>3.5</option>
                                <option value ='4'>4</option>
                                <option value ='4.5'>4.5</option>
                                <option value ='5'>5</option>
                            </select>
                            <button type ="submit" class='btn btn-success'>Add this album</button>
                        </form>
                </div>
                </div>
        {% endfor %}
            </div>
        {% endif %}
    </body>
</html>
